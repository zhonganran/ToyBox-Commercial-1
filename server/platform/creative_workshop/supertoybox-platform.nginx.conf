server {
    server_name admin.689588.xyz api.689588.xyz cdn.689588.xyz;

    client_max_body_size 240m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /creative-workshop/catalog.json {
        alias /var/lib/supertoybox/platform/uploads/creative_workshop/catalog.json;
        default_type application/json;
        limit_except GET HEAD OPTIONS { deny all; }
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Last-Modified, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /creative-workshop/ {
        alias /var/lib/supertoybox/platform/uploads/creative_workshop/;
        autoindex off;
        limit_except GET HEAD OPTIONS { deny all; }
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Last-Modified, Accept-Ranges" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.689588.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.689588.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = cdn.689588.xyz) {
        return 301 https://$host$request_uri;
    }

    if ($host = api.689588.xyz) {
        return 301 https://$host$request_uri;
    }

    if ($host = admin.689588.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name admin.689588.xyz api.689588.xyz cdn.689588.xyz;
    return 404;
}
