name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/platform/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/platform/requirements.txt

      - name: Run backend tests
        run: >-
          python -W error::ResourceWarning
          -m unittest discover
          -s server/platform
          -p 'test_*.py'

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android toolchain
        run: >-
          sdkmanager
          "platforms;android-34"
          "build-tools;34.0.0"
          "cmake;3.22.1"
          "ndk;27.0.12077973"

      - name: Run unit tests, lint, and Android builds
        run: >-
          ./gradlew
          verifySourceHealth
          :app:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          :app:assembleDebug
          --no-daemon
          --stacktrace

  release:
    name: Signed release and certificate verification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties

      - name: Build signed release with R8
        run: >-
          ./gradlew
          :app:assembleRelease
          -PrequireReleaseSigning=true
          --no-daemon
          --stacktrace

      - name: Verify APK signature and certificate
        env:
          EXPECTED_CERT_SHA256: c145426578399e39dc3bf6b06b6295f5f86ab9811ab13f3b655aad6c4bfd7415
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          apksigner verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
