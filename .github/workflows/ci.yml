name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/platform/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/platform/requirements.txt

      - name: Run backend tests
        run: >-
          python -W error::ResourceWarning
          -m unittest discover
          -s server/platform
          -p 'test_*.py'

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: >-
          sdkmanager
          "platforms;android-34"
          "build-tools;34.0.0"
          "cmake;3.22.1"
          "ndk;27.0.12077973"

      - name: Run unit tests, lint, and Android builds
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --no-daemon
          --stacktrace
